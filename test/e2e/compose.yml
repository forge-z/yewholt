services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: e2e-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U buzz -d buzz]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
  relay:
    image: ghcr.io/block/buzz:0.3.0@sha256:84f34c5b801192665b1a05939518d746f25184babf4d6e927d0de7e12e9c5674
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://buzz:e2e-only@postgres/buzz
      REDIS_URL: redis://redis:6379
      RELAY_URL: wss://localhost:${E2E_PORT}
      RELAY_OWNER_PUBKEY: ${E2E_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${E2E_RELAY_SECRET}
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_AUTO_MIGRATE: 'true'
      BUZZ_REQUIRE_AUTH_TOKEN: 'true'
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: 'true'
      BUZZ_ALLOW_NIP_OA_AUTH: 'true'
      BUZZ_GIT_CONFORMANCE_PROBE: 'false'
  tls:
    image: caddy:2-alpine
    depends_on: [relay]
    ports:
      - 127.0.0.1:${E2E_PORT}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${E2E_TLS_DIR}:/tls:ro
